# Mai Household — CI
# Analyse + Tests, danach Release-APK als Artefakt zum Testen.
name: CI

on:
  push:
    # Alle Branches: APK-Build früh validieren.
    branches: ["**"]
  pull_request:
    branches: [main]

# Nur lesen; keine Schreibrechte für Actions im CI.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-apk:
    name: Release APK
    needs: [analyze-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ubuntu-latest liefert ANDROID_HOME bereits (Runner-Image).
      # Kein android-actions/setup-android — das scheiterte im ersten Run.
      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses >/dev/null 2>&1 || true

      - name: Pub get
        run: flutter pub get

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Build release APK
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee apk-build.log; then
            {
              echo "## APK build failed"
              echo
              echo '```text'
              # Kontext um den eigentlichen Fehler (nicht nur die FAILURE-Zeile)
              if grep -n 'What went wrong:' apk-build.log >/dev/null 2>&1; then
                start=$(grep -n 'What went wrong:' apk-build.log | tail -n 1 | cut -d: -f1)
                start=$((start > 5 ? start - 5 : 1))
                sed -n "${start},$((start + 40))p" apk-build.log
              else
                tail -n 120 apk-build.log
              fi
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Annotationen: Fehlerblock, nicht die pub-outdated-Liste
            if grep -n 'What went wrong:' apk-build.log >/dev/null 2>&1; then
              start=$(grep -n 'What went wrong:' apk-build.log | tail -n 1 | cut -d: -f1)
              start=$((start > 2 ? start - 2 : 1))
              sed -n "${start},$((start + 25))p" apk-build.log
            else
              tail -n 30 apk-build.log
            fi | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr '|' '/' | cut -c1-200)
              # Leere Zeilen und reine Trenner überspringen
              case "$safe" in
                ''|'---'*|'===') continue ;;
              esac
              echo "::error::$safe"
            done
            exit 1
          fi
        env:
          # Runner-RAM schonen; Daemon in CI ausschalten
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      # Uhr-App (android/wear) entsteht im selben Gradle-Lauf mit; hier
      # zusätzlich ihre Logik-Tests.
      - name: Wear OS build & unit tests
        working-directory: android
        # assembleRelease ist meist schon aktuell (flutter build apk baut alle Module).
        run: ./gradlew :wear:testDebugUnitTest :wear:assembleRelease
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Upload APK build log (failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk-build-log
          path: apk-build.log
          if-no-files-found: ignore
          retention-days: 7

      # Einheitlicher Dateiname für alle Mai-Apps: <repo>.apk
      - name: Rename APK
        if: success()
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/mai-household.apk
          # Uhr-APK: gleiche Signatur wie das Telefon-APK (gleicher Runner).
          cp build/wear/outputs/apk/release/wear-release.apk build/app/outputs/flutter-apk/mai-household-wear.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mai-household-apk
          path: |
            build/app/outputs/flutter-apk/mai-household.apk
            build/app/outputs/flutter-apk/mai-household-wear.apk
          if-no-files-found: error
          retention-days: 14
